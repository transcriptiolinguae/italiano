<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcriptio Linguae</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <style>
    html {
      font-size: 16px;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 1280px;
      margin: 2rem auto;
      padding: 0 3rem;
      color: #2c3e50;
      background: #fff;
      line-height: 1.6;
      font-size: 1rem;
    }

    .site-header {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      background: #fff;
    }

    .site-logo {
      max-width: 100%;
      height: auto;
      width: 400px;
      margin-bottom: 10px;
    }

    .site-header h1,
    .site-header h3 {
      margin: 0.2rem 0;
    }

    h1 {
      font-family: "Times New Roman", Times, serif;
      text-align: center;
      color: #34495e;
      margin: 0 0 0.5rem;
      font-weight: 700;
    }

    h3 {
      font-family: Arial, sans-serif;
      text-align: center;
      font-weight: 500;
      color: #7f8c8d;
      margin-bottom: 2rem;
    }

    .text-columns {
      display: flex;
      gap: 1rem;
      align-items: stretch;
    }

    .text-columns textarea,
    .text-columns pre {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
    }

    .text-columns textarea {
      min-height: 6em;
    }

    .text-columns pre {
      margin-top: 0;
      margin-bottom: 0;
    }

    textarea,
    pre {
      font-family: Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 6em;
      padding: 0.75em 1em;
      border: 1.5px solid #ccc;
      border-radius: 5px;
      resize: vertical;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border: 1.5px solid #ccc;
      box-shadow: none;
    }

    textarea::placeholder {
      color: grey;
      user-select: none;
    }

    pre {
      background: #ecf0f1;
      padding: 1.25rem 1.5rem;
      border-radius: 5px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0;
      box-shadow: inset 0 0 5px #dfe6e9;
    }

    pre.placeholder {
      color: grey;
      user-select: none;
    }

    pre:not(.placeholder) {
      color: #5e5e5e;
      user-select: text;
    }

    #language {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #000;
      background: #fff;
      border: none;
      padding: 0;
      cursor: pointer;
      outline: none;
    }

    #language option {
      background: #fff;
      color: #000;
    }

    button {
      font-family: Arial, sans-serif;
      background: #fff;
      color: grey;
      border: none;
      border-radius: 5px;
      padding: 0.65em 1em;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.25s ease;
    }

    button:disabled {
      background: #ecf0f1;
      cursor: not-allowed;
    }

    .button-row {
      display: flex;
      justify-content: left;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .triple-line-button {
      display: flex;
      color: grey;
      line-height: 1.2;
      text-decoration: none;
      width: auto;
      font-size: 14px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 12px;
    }

    .triple-line-button span {
      display: block;
      opacity: 0.6;
    }

    .triple-line-button:hover span {
      opacity: 1;
    }

    .line-1 {
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .site-logo {
        width: 400px;
      }
    }

    @media (max-width: 480px) {
      .site-logo {
        width: 400px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 0 24px;
      }

      .text-columns {
        flex-direction: column;
      }

      .text-columns textarea,
      .text-columns pre {
        flex: none;
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a href="https://transcriptiolinguae.github.io/">
      <img
        src="/img/logo.svg"
        alt="Transcriptio Linguae Logo"
        class="site-logo"
      >
    </a>
  </header>

  <select id="language">
    <option value="it">Italian</option>
    <option value="en">English</option>
    <option value="de">German</option>
    <option value="fr">French</option>
  </select>

  <div class="button-row">
    <button id="afi" class="triple-line-button">
      <span class="line-1">IPA</span>
    </button>

    <button id="testoafi" class="triple-line-button">
      <span class="line-1">Word IPA</span>
    </button>

    <button id="g2p" class="triple-line-button">
      <span class="line-1">G2P</span>
    </button>

    <a
      class="triple-line-button"
      href="https://transcriptiolinguae.gumroad.com/"
    >
      <span class="line-1">Align</span>
    </a>
  </div>

  <div class="text-columns">
    <textarea
      id="input"
      rows="6"
      cols="60"
      placeholder="Enter text"
    ></textarea>

    <pre id="output" class="placeholder">Transcription</pre>
  </div>

  <script type="module">
    import initESpeak from './espeak-ng.js';

    /* ------------------------------------------------------------------
       Configuration
    ------------------------------------------------------------------ */

    const VOICES = {
      it: 'it',
      en: 'en',
      de: 'de',
      fr: 'fr'
    };

    const DICTIONARIES = {
      it: './phonitalia.json',
      en: './phonenglish.json',
      de: './phongerman.json',
      fr: './phonfrench.json'
    };

    const WORD_REGEX =
      /[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+(?:'[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+)*/u;

    const TOKEN_REGEX =
      /[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+(?:'[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+)*|[0-9]+(?:[.,][0-9]+)?|[^\s]/gu;

    const WHITESPACE_REGEX = /\s/;
    const DIACRITIC_REGEX = /[\u0300-\u036F\u200B-\u200D\uFEFF]/g;
    const IPA_PARENTHESES_REGEX = /\(([^()]*)\)/g;

    const outputElem = document.getElementById('output');
    const inputElem = document.getElementById('input');
    const languageElem = document.getElementById('language');

    const buttons = {
      ipa: document.getElementById('afi'),
      inline: document.getElementById('testoafi'),
      g2p: document.getElementById('g2p')
    };

    /* ------------------------------------------------------------------
       State
    ------------------------------------------------------------------ */

    let currentLanguage = 'it';
    let languageApplyG2P = null;
    let languageValidate = null;

    // Cache dictionaries and language modules so changing languages
    // does not repeatedly download the same files.
    const dictionaryCache = new Map();
    const languageCache = new Map();

    let ipaDictionary = {};
    let wasmReady = false;

    outputElem.tabIndex = 0;

    /* ------------------------------------------------------------------
       Output helpers
    ------------------------------------------------------------------ */

    function showPlaceholder() {
      outputElem.className = 'placeholder';
      outputElem.innerText = 'Transcription';
    }

    function showProgressPlaceholder() {
      outputElem.className = 'placeholder';
      outputElem.innerText = 'Transcription in progress...';
    }

    function setOutput(text) {
      outputElem.classList.remove('placeholder');
      outputElem.innerText = text;
    }

    /* ------------------------------------------------------------------
       Text helpers
    ------------------------------------------------------------------ */

    function normalizeCurlyApostrophes(text) {
      return text.replace(/[’‘]/g, "'");
    }

    function splitTextByLength(text, maxLength = 500) {
      const chunks = [];
      let start = 0;

      while (start < text.length) {
        let end = Math.min(start + maxLength, text.length);

        if (end < text.length) {
          const lastSpace = text.lastIndexOf(' ', end);

          if (lastSpace > start) {
            end = lastSpace;
          }
        }

        chunks.push(text.slice(start, end));
        start = end;
      }

      return chunks;
    }

    function tokenize(text) {
      return text.match(TOKEN_REGEX);
    }

    function isWord(token) {
      return WORD_REGEX.test(token);
    }

    /* ------------------------------------------------------------------
       Dictionary
    ------------------------------------------------------------------ */

    function getDictionaryFile() {
      return DICTIONARIES[currentLanguage];
    }

    function getVoice() {
      return VOICES[currentLanguage];
    }

    async function loadDictionary() {
      const language = currentLanguage;

      if (dictionaryCache.has(language)) {
        ipaDictionary = dictionaryCache.get(language);
        return;
      }

      const response = await fetch(DICTIONARIES[language]);
      const rawDictionary = await response.json();

      const dictionary = {};

      for (const [key, value] of Object.entries(rawDictionary)) {
        dictionary[key.normalize('NFC').toLowerCase()] = value;
      }

      dictionaryCache.set(language, dictionary);
      ipaDictionary = dictionary;
    }

    function getDictionaryIPA(word) {
      const key = word.normalize('NFC').toLowerCase();
      return ipaDictionary[key] || null;
    }

    function getElisionDictionaryIPA(word) {
      if (!word.includes("'")) {
        return null;
      }

      const parts = word.split("'");

      if (parts.length !== 2) {
        return null;
      }

      const [firstPart, secondPart] = parts;

      if (!firstPart || !secondPart) {
        return null;
      }

      let firstIPA = null;

      for (const vowel of ['a', 'e', 'i', 'o', 'u']) {
        const candidateIPA = getDictionaryIPA(firstPart + vowel);

        if (candidateIPA) {
          firstIPA = candidateIPA;
          break;
        }
      }

      const secondIPA = getDictionaryIPA(secondPart);

      if (!firstIPA || !secondIPA) {
        return null;
      }

      const firstClean = firstIPA
        .replace(/[ˈˌ]/g, '')
        .replace(/[aeiouɛɔəɪʊ]+$/, '');

      return firstClean + secondIPA;
    }

    /* ------------------------------------------------------------------
       Language modules
    ------------------------------------------------------------------ */

    async function loadLanguageModule() {
      const language = currentLanguage;

      if (languageCache.has(language)) {
        const module = languageCache.get(language);

        languageApplyG2P = module.applyG2PMapping;
        languageValidate = module.validateOrReturnOriginal;

        return;
      }

      const module = await import(`./${language}.js`);

      languageCache.set(language, module);

      languageApplyG2P = module.applyG2PMapping;
      languageValidate = module.validateOrReturnOriginal;
    }

    function applyG2PMapping(text, ipa) {
      return languageApplyG2P
        ? languageApplyG2P(text, ipa)
        : ipa;
    }

    function validateOrReturnOriginal(originalWord, mappedString) {
      return languageValidate
        ? languageValidate(originalWord, mappedString)
        : mappedString;
    }

    /* ------------------------------------------------------------------
       eSpeak
    ------------------------------------------------------------------ */

    function printErrFiltered(error) {
      if (
        error.includes('still waiting on run dependencies') ||
        error.includes('dependency: wasm-instantiate') ||
        error.includes('(end of list)')
      ) {
        return;
      }

      console.error('eSpeak stderr:', error);
    }

    async function runESpeak(text) {
      let ipaOutput = '';

      await initESpeak({
        arguments: [
          '-v',
          getVoice(),
          '--ipa=3',
          text
        ],

        print: text => {
          ipaOutput += text;
        },

        printErr: printErrFiltered
      });

      return ipaOutput
        .replace(DIACRITIC_REGEX, '')
        .trim();
    }

    /* ------------------------------------------------------------------
       IPA map
    ------------------------------------------------------------------ */

    async function computeIPAMap(words) {
      const map = new Map();

      // Remove duplicates before sending anything to eSpeak.
      const uniqueWords = [...new Set(words)];

      if (!uniqueWords.length) {
        return map;
      }

      const espeakWords = [];

      for (const word of uniqueWords) {
        const dictIPA = getDictionaryIPA(word);

        if (dictIPA) {
          map.set(word, dictIPA);
          continue;
        }

        const elisionIPA = getElisionDictionaryIPA(word);

        if (elisionIPA) {
          map.set(word, elisionIPA);
          continue;
        }

        espeakWords.push(word);
      }

      if (!espeakWords.length) {
        return map;
      }

      const ipaRaw = await runESpeak(espeakWords.join('|'));
      const ipaWords = ipaRaw
        .replace(/\|/g, ' ')
        .trim()
        .split(/\s+/);

      for (let i = 0; i < espeakWords.length; i++) {
        map.set(espeakWords[i], ipaWords[i] || '');
      }

      return map;
    }

    /* ------------------------------------------------------------------
       Conversion
    ------------------------------------------------------------------ */

    function extractIPA(mapped) {
      const pieces = [...mapped.matchAll(IPA_PARENTHESES_REGEX)];
      return pieces.map(match => match[1]).join('');
    }

    function reconstructChunk(chunk, tokens, converted) {
      let result = '';
      let position = 0;

      for (let i = 0; i < tokens.length; i++) {
        while (
          position < chunk.length &&
          WHITESPACE_REGEX.test(chunk[position])
        ) {
          result += chunk[position++];
        }

        result += converted[i];
        position += tokens[i].length;
      }

      return result;
    }

    async function convertChunk(chunk, mode) {
      const tokens = tokenize(chunk);

      if (!tokens) {
        return chunk;
      }

      const words = tokens.filter(isWord);

      let ipaMap = await computeIPAMap(words);
      const converted = new Array(tokens.length);

      for (let i = 0; i < tokens.length; i++) {
        const token = tokens[i];

        if (!isWord(token)) {
          converted[i] = token;
          continue;
        }

        let ipa = ipaMap.get(token) || '';
        let mapped = applyG2PMapping(token, ipa);

        /*
         * Some language modules return null when they need more context.
         * Re-run eSpeak starting at the current word, matching the
         * behavior of the original implementation.
         */
        if (mapped === null) {
          let nextWordIndex = i + 1;

          while (
            nextWordIndex < tokens.length &&
            !isWord(tokens[nextWordIndex])
          ) {
            nextWordIndex++;
          }

          if (nextWordIndex >= tokens.length) {
            converted[i] = token;
            continue;
          }

          const remainingWords = tokens
            .slice(i)
            .filter(isWord);

          ipaMap = await computeIPAMap(remainingWords);

          ipa = ipaMap.get(token) || '';
          mapped = applyG2PMapping(token, ipa);
        }

        if (mapped === null) {
          converted[i] = token;
          continue;
        }

        mapped = validateOrReturnOriginal(token, mapped);

        if (mode === 'g2p') {
          converted[i] = mapped;
          continue;
        }

        const ipaString = extractIPA(mapped);

        if (!ipaString.trim()) {
          converted[i] = token;
        } else if (mode === 'inline') {
          converted[i] = `${token} (${ipaString})`;
        } else {
          converted[i] = ipaString;
        }
      }

      return reconstructChunk(chunk, tokens, converted);
    }

    async function processText(mode) {
      showProgressPlaceholder();

      await waitForWasm();

      const rawInput = normalizeCurlyApostrophes(
        inputElem.value.trim()
      ).normalize('NFC');

      if (!rawInput) {
        showPlaceholder();
        return;
      }

      try {
        const chunks = splitTextByLength(rawInput, 500);
        const results = [];

        for (const chunk of chunks) {
          results.push(await convertChunk(chunk, mode));
        }

        setOutput(results.join('').trim());
      } catch (error) {
        console.error(`Error during ${mode} processing:`, error);

        setOutput(
          `Error during ${mode} processing: ${error.message}`
        );
      }
    }

    /* ------------------------------------------------------------------
       WASM initialization
    ------------------------------------------------------------------ */

    async function initialize() {
      try {
        await loadDictionary();
        await loadLanguageModule();

        await initESpeak({
          print: () => {},
          printErr: () => {}
        });

        wasmReady = true;
      } catch (error) {
        console.error('STARTUP ERROR:', error);

        outputElem.classList.remove('placeholder');
        outputElem.innerText =
          'Error loading dictionary or eSpeak: ' + error.message;
      }
    }

    async function waitForWasm() {
      while (!wasmReady) {
        await new Promise(resolve => setTimeout(resolve, 100));
      }
    }

    /* ------------------------------------------------------------------
       Events
    ------------------------------------------------------------------ */

    outputElem.addEventListener('click', () => {
      outputElem.focus();
    });

    outputElem.addEventListener('keydown', event => {
      if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === 'a'
      ) {
        event.preventDefault();

        const selection = window.getSelection();
        const range = document.createRange();

        range.selectNodeContents(outputElem);

        selection.removeAllRanges();
        selection.addRange(range);
      }
    });

    languageElem.addEventListener('change', async event => {
      currentLanguage = event.target.value;

      try {
        await loadDictionary();
        await loadLanguageModule();
      } catch (error) {
        console.error('LANGUAGE CHANGE ERROR:', error);
      }
    });

    buttons.ipa.addEventListener('click', () => {
      processText('ipa');
    });

    buttons.inline.addEventListener('click', () => {
      processText('inline');
    });

    buttons.g2p.addEventListener('click', () => {
      processText('g2p');
    });

    /* ------------------------------------------------------------------
       Start
    ------------------------------------------------------------------ */

    window.addEventListener('load', initialize);
  </script>

</body>
</html>
