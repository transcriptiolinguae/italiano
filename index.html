<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcriptio Linguae</title>
  <link rel="icon" type="image/x-icon" href="/italiano/favicon.ico">

  <style>
    html {
      font-size: 16px;
    }

/* Reset max-width for header so it can center properly */
.site-header {
  display: flex;
  flex-direction: column;   /* Stack logo and headings vertically */
  justify-content: center;
  align-items: center;      /* Center horizontally */
  padding: 20px 0;
  text-align: center;
  width: 100%;              /* Full width of page */
  box-sizing: border-box;   /* Ensure padding doesn’t break width */
  background-color: #ffffff;
}

/* Make the logo responsive */
.site-logo {
  max-width: 100%;   /* Never exceed container width */
  height: auto;      /* Keep aspect ratio */
  width: 400px;      /* Default width */
  margin-bottom: 10px;
}

/* Optional: Adjust logo size on smaller screens */
@media (max-width: 768px) {
  .site-logo {
    width: 400px;
  }
}

@media (max-width: 480px) {
  .site-logo {
    width: 400px;
  }
}

/* Center headings under logo */
.site-header h1,
.site-header h3 {
  margin: 0.2rem 0;
}



    
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 3rem;
      color: #2c3e50;
      background: #ffffff;
      line-height: 1.6;
      font-size: 1rem;
    }

    h1 {
      font-family: "Times New Roman", Times, serif;
      text-align: center;
      color: #34495e;
      margin: 0 0 0.5rem 0;
      font-weight: 700;
    }

    h3 {
      font-family: Arial, sans-serif;
      text-align: center;
      font-weight: 500;
      color: #7f8c8d;
      margin-bottom: 2rem;
    }

    textarea, pre {
      font-family: Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 6em;
      padding: 0.75em 1em;
      border: 1.5px solid #ccc;
      border-radius: 5px;
      resize: vertical;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border: 1.5px solid #ccc;
      box-shadow: none;
    }

    textarea::placeholder {
      color: grey;
      user-select: none;
    }

#output {
    white-space: pre;
}
    
    pre {
      background: #ecf0f1;
      padding: 1.25rem 1.5rem;
      border-radius: 5px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 2rem;
      box-shadow: inset 0 0 5px #dfe6e9;
    }

    pre.placeholder {
      color: grey;
      user-select: none;
    }

    pre:not(.placeholder) {
      color: #5e5e5e;
      user-select: text;
    }

    button {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: grey;
      border: none;
      border-radius: 5px;
      padding: 0.65em 1em;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.25s ease;
      margin-right: 1rem;
      margin-bottom: 2px;
    }



    button:disabled {
      background: #ecf0f1;
      cursor: not-allowed;
    }




.button-row {
  display: flex;             /* ← puts the buttons side by side in a row */
    justify-content: center;  /* centers buttons horizontally */
    flex-wrap: wrap;      /* <-- allows stacking on small screens */
}

.triple-line-button {
  display: flex;
  color: grey;
  line-height: 1.2;
  text-decoration: none;
  width: 180px; 
  font-size: 14px;
  flex-direction: column;    /* stack the spans vertically */
  align-items: center;       /* center horizontally inside button */
  justify-content: center;   /* center vertically, if you wish */
  /* optional: padding, width, text-align etc. */
  text-align: center;
  padding: 8px 12px;
}

.triple-line-button span {
  display: block;
  opacity: 0.6;          /* normal state: slightly transparent */
}


 .triple-line-button:hover span {
  opacity: 1;            /* hover: fully visible */
}   

    
.line-1 {
  font-weight: 600;
}

    
.line-3 {
  color: darkgrey;
}

    .line-4 {
  color: darkgrey;
  margin-top: -4px;
  font-size: 9px;
      
}

    

    @media (max-width: 600px) {
      textarea, pre {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="https://transcriptiolinguae.github.io/italiano/">
    <img src="/italiano/img/logo.svg" alt="Transcriptio Linguae Logo" class="site-logo" />
    </a> 
  </header>  


  <textarea id="input" rows="6" cols="60" placeholder="Inserisci testo in italiano"></textarea>
  <div class="button-row">
  <button id="afi" class="triple-line-button">
  <span class="line-1">I</span>
  <span class="line-1">Only IPA</span>
  <span class="line-3">abc</span>
  </button>
  <button id="testoafi" class="triple-line-button">
  <span class="line-1">II</span>
  <span class="line-1">Word before IPA</span>
  <span class="line-3">Abc (abc)</span>
  </button>
  <button id="g2p" class="triple-line-button">
  <span class="line-1">III</span>
  <span class="line-1">Grapheme-to-phoneme</span>
  <span class="line-3">A(a)b(b)c(c)</span>
  </button>
  <a class="triple-line-button" href="https://transcriptiolinguae.gumroad.com/">
  <span class="line-1">IV</span>
  <span class="line-1">G2P Alingment</span>
  <span class="line-3">Abc</span>
  <span class="line-4">a b c</span>
  </a>
  </div>

  <textarea id="output" class="placeholder" placeholder="Trascrizione"></textarea>


<script type="module" src="/italiano/main.min.js" defer></script>


</body>
</html>
