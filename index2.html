<script type="module">
  import initESpeak from './espeak-ng.js';

  // Normalize curly apostrophes to straight apostrophes
function normalizeCurlyApostrophes(text) {
  return text.replace(/[’‘]/g, "'");
}
  
  const outputElem = document.getElementById('output');
  const inputElem = document.getElementById('input');

  let wasmReady = false;

  window.addEventListener('load', async () => {
    try {
      await initESpeak({
        print: () => {},
        printErr: () => {}
      });
      wasmReady = true;
      console.log('eSpeak NG WASM loaded and ready');
    } catch (e) {
      console.error('Error loading WASM:', e);
      outputElem.classList.remove('placeholder');
      outputElem.innerText = 'Error loading eSpeak WASM module.';
    }
  });

  function printErrFiltered(err) {
    if (
      err.includes('still waiting on run dependencies') ||
      err.includes('dependency: wasm-instantiate') ||
      err.includes('(end of list)')
    ) {
      return;
    }
    console.error('eSpeak stderr:', err);
  }

  async function runESpeak(text) {
    let ipaOutput = '';
    await initESpeak({
      arguments: ['-v', 'it', '--ipa=3', text],
      print: (text) => {
        ipaOutput += text;
      },
      printErr: printErrFiltered
    });

    return ipaOutput
      .replace(/[\u0300-\u036F\u200B-\u200D\uFEFF]/g, '') // <--- strip hidden chars
      .replace(/rɾ/g, 'rː')
      .replace(/mm/g, 'mː')
      .replace(/ff/g, 'fː')
      .replace(/vv/g, 'vː')
      .replace(/ll/g, 'lː')
      .replace(/kk/g, 'kː')
      .replace(/nn/g, 'nː')
      .replace(/ɲɲ/g, 'ɲː')
      .replace(/oo/g, 'oː')      
      .replace(/ss/g, 'sː')
      .replace(/tt/g, 't')
      .replace(/dd/g, 'd')
      .replace(/ɾ/g, 'r')
      .replace(/ɪ/g, 'i')
      .replace(/ʊ/g, 'u')
      .replace(/ɡ/g, 'g')
      .trim();
  }

  function showPlaceholder() {
    outputElem.className = 'placeholder';
    outputElem.innerText = 'Transcription';
  }

  function showProgressPlaceholder() {
    outputElem.className = 'placeholder';
    outputElem.innerText = 'Transcription in progress...';
  }

  function setOutput(text) {
    outputElem.classList.remove('placeholder');
    outputElem.innerText = text;
  }

// Helper: Split text into manageable chunks (max 500 characters)
function splitTextByLength(text, maxLength = 500) {
  const chunks = [];
  let start = 0;
  while (start < text.length) {
    let end = start + maxLength;

    // Try not to cut off words in the middle
    if (end < text.length) {
      const lastSpace = text.lastIndexOf(' ', end);
      if (lastSpace > start) {
        end = lastSpace;
      }
    }

    chunks.push(text.slice(start, end));
    start = end;
  }
  return chunks;
}


// ===================================================================
//  NEW BUTTON: G2P AFI
//  Outputs ONLY IPA for words that have valid G2P mapping,
//  Words without mapping remain unchanged.
// ===================================================================
document.getElementById('afi').addEventListener('click', async () => {
  showProgressPlaceholder();

  if (!wasmReady) {
    alert("Please wait, WASM is still loading...");
    return;
  }

  const rawInput = normalizeCurlyApostrophes(inputElem.value.trim());
  if (!rawInput) {
    showPlaceholder();
    return;
  }

  try {
    const chunks = splitTextByLength(rawInput, 500);
    let finalResult = '';

    for (const chunk of chunks) {

      const tokens = chunk.match(
        /[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+(?:'[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+)*|[0-9]+(?:[.,][0-9]+)?|[^\s]/gu
      );

      if (!tokens) {
        finalResult += chunk;
        continue;
      }

      // Extract real words
      let words = tokens.filter(t =>
        /^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u.test(t)
      );

      // First IPA pass
      let ipaMap = await computeIPAMap(words);

      const converted = [];

      for (let t = 0; t < tokens.length; t++) {

        const token = tokens[t];
        const isWord =
          /^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u.test(token);

        if (!isWord) {
          converted.push(token);
          continue;
        }

        let ipa = ipaMap.get(token) || "";
        let mapped = applyG2PMapping(token, ipa);

        // If mapping fails → recover
        if (mapped === null) {

          // Find next real word
          let nextWordIndex = t + 1;
          while (
            nextWordIndex < tokens.length &&
            !/^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u
              .test(tokens[nextWordIndex])
          ) {
            nextWordIndex++;
          }

          if (nextWordIndex >= tokens.length) {
            // no mapping → return original word
            converted.push(token);
            continue;
          }

          const remainingWords = tokens
            .slice(nextWordIndex)
            .filter(tt =>
              /^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u.test(tt)
            );

          ipaMap = await computeIPAMap(remainingWords);

          ipa = ipaMap.get(token) || "";
          mapped = applyG2PMapping(token, ipa);
        }

        // If still no mapping → ORIGINAL WORD
        if (mapped === null) {
          converted.push(token);
          continue;
        }

        // Validate mapping
        mapped = validateOrReturnOriginal(token, mapped);

        // Extract IPA parentheses
        const ipaPieces = [...mapped.matchAll(/\(([^()]*)\)/g)];
        const ipaString = ipaPieces.map(x => x[1]).join("");

        // If IPA is empty → original word
        if (!ipaString.trim()) {
          converted.push(token);
        } else {
          // FINAL OUTPUT: only IPA
          converted.push(ipaString);
        }
      }

      // Reconstruct text preserving whitespace
      let rebuilt = '';
      let pos = 0;

      for (const token of tokens) {
        while (chunk[pos] && /\s/.test(chunk[pos])) {
          rebuilt += chunk[pos++];
        }
        rebuilt += converted.shift();
        pos += token.length;
      }

      finalResult += rebuilt;
    }

    setOutput(finalResult.trim());

  } catch (e) {
    console.error("Error in G2P AFI:", e);
    setOutput("Error during G2P AFI processing: " + e.message);
  }
});

// ------------------------------------------------------
// Helper: compute IPA map for a list of words (batch mode)
// ------------------------------------------------------
async function computeIPAMap(words) {
  const unique = [...new Set(words)];
  const marked = unique.join("|");
  const ipaRaw = await runESpeak(marked);
  const ipaClean = ipaRaw.replace(/\|/g, " ").trim();
  const ipaWords = ipaClean.split(/\s+/);
  const map = new Map();
  for (let i = 0; i < unique.length; i++) {
    map.set(unique[i], ipaWords[i] || "");
  }
  return map;
}



  

function validateOrReturnOriginal(originalWord, mappedString) {
  const allowedMappings = {
    ha: ['a', 'ˈa', 'ˌa'],
    a: ['a', 'ˈa', 'ˌa'],
    à: ['a', 'ˈa', 'ˌa'],  
    bb: ['bː'],
    b: ['b', 'ˈb'],
    cci: ['tʃː'],
    cch: ['kː'],
    cc: ['tʃː', 'kː'],    
    ch: ['k', 'ˈk'],
    ci: ['tʃ', 'ˈtʃ'],
    cq: ['kː'], 
    c: ['k', 'tʃ', 'ˈk', 'ˈtʃ'],
    dd: ['dː'],
    d: ['d', 'ˈd'],
    e: ['e', 'ˈe', 'ɛ', 'ˈɛ'],
    è: ['e', 'ˈe', 'ɛ', 'ˈɛ'],
    é: ['e', 'ˈe', 'ɛ', 'ˈɛ'],
    ff: ['fː'],
    f: ['f', 'ˈf'],
    gli: ['ʎ', 'ˈʎ'],
    ggi: ['dʒː'],
    gl: ['ʎ', 'ˈʎ'],
    gg: ['gː', 'dʒː'],
    gn: ['ɲː', 'ɲ', 'ˈɲ'],
    gh: ['g'],
    gi: ['dʒ', 'ˈdʒ'],
    g: ['g', 'ˈg', 'dʒ', 'ˈdʒ'],
    i: ['i', 'ˈi', 'j', 'ˈj'],
    ì: ['i', 'ˈi', 'j', 'ˈj'],
    ll: ['lː'],
    l: ['l', 'ˈl'],
    mm: ['mː'],
    m: ['m', 'ˈm'],
    nn: ['nː'],
    n: ['n', 'ˈn', 'ŋ', 'ˈŋ'],
    ho: ['o', 'ˈo', 'ɔ', 'ˈɔ', 'ˌo', 'ˌɔ'],
    o: ['o', 'ˈo', 'ɔ', 'ˈɔ', 'oː'],
    ò: ['o', 'ˈo', 'ɔ', 'ˈɔ'],
    pp: ['pː'],
    p: ['p', 'ˈp'],
    q: ['k', 'ˈk'],
    rr: ['rː'],
    r: ['r', 'ˈr'],
    sci: ['ʃ', 'ˈʃ'],
    sc: ['ʃ', 'ˈʃ'],
    ss: ['sː'],
    s: ['s', 'ˈs', 'z', 'ˈz'],
    tt: ['tː'],
    t: ['t', 'ˈt'],
    u: ['u', 'ˈu', 'w', 'ˈw'],
    ù: ['u', 'ˈu'],
    vv: ['vː'],
    v: ['v', 'ˈv'],
    z: ['ts', 'dz', 'ˈts', 'ˈdz',],
    zz: ['tsː', 'dzː']
  };

  const regex = /([\p{L}]+)\(([^()]*)\)/gu;

  let match;

  while ((match = regex.exec(mappedString)) !== null) {
    const letters = match[1].toLowerCase();
    const ipa = match[2];
    
    // NEW: empty mapping
    if (ipa.trim() === '') return originalWord;
    
    // letter sequence not in allowed list → return original
    if (!allowedMappings[letters]) return originalWord;

    // ipa value not allowed → return original
    if (!allowedMappings[letters].includes(ipa)) return originalWord;
  }

  return mappedString;
}
