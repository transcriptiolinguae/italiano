<body>

  <header class="site-header">

  <textarea id="input" rows="6" cols="60" placeholder="Insert text in Italian"></textarea>

  <pre id="output" class="placeholder">Transcription</pre>

  
<script type="module">
  import initESpeak from './espeak-ng.js';





  
  // Normalize curly apostrophes to straight apostrophes
function normalizeCurlyApostrophes(text) {  // The parameter text will contain whatever string you pass into the function.
  return text.replace(/[’‘]/g, "'");  // Match one character from the list in [] square brackets, where "g" means replace globally every word with character in quotes "'".
}
  

  
  
  
  const outputElem = document.getElementById('output');  // This looks inside your HTML for "<pre id="output">" and stores it. Why const? Because this variable never changes. It always points to the same HTML element.

  
  
  
  
  const inputElem = document.getElementById('input');





  
let wasmReady = false;  // This creates a variable. Unlike const, let allows changing the value later.





  
  async function waitForWasm() {  // "Async" tells JavaScript that a function may need to wait for something that takes time. Normally, JavaScript executes code line by line without stopping. Without async, JavaScript would either freeze the webpage while waiting or continue running before eSpeak is ready. So async allows the function to pause itself while letting the rest of the webpage continue running. So it's job is to wait until the WebAssembly engine has finished loading.
  while (!wasmReady) {  //  A while loop keeps repeating as long as the condition is true. The exclamation mark means NOT. So when eSpeak is not loaded, then "wasmReady = false" and so "!wasmReady = true". When eSpeak is loaded, the condition "wasmReady = false" is not anymore true when negated, so the loop stops.
    await new Promise(r => setTimeout(r, 100));  //  Await pauses only this function for 100 ms until something finishes. A promise represents something that will finish later, what in this case is 100ms delay. r => is an arrow function and shorthand for "function(r){setTimeout(r,100);}". So the this means: "Create Promise ↓ Wait 100 ms ↓ Resolve Promise ↓ Await Continues" or "pause this function for 100 milliseconds". So the loop repeats: "While (!wasmReady) ↓ Wait 100 ms ↓ Check Again ↓ Wait 100 ms ↓ Check Again ↓ Wait 100 ms until wasmReady = true".
  }
}





// IPA dictionary
let ipaDictionary = {};  //  let creates a variable whose value can change later. {} creates an empty JavaScript object. Think of it as a dictionary or lookup table. Initially it contains nothing. Later it will become something like { "ciao": "ˈtʃa.o" }. Then your code can instantly look up pronunciations.








  
  
window.addEventListener('load', async () => {  //  window is the browser itself. Everything on your webpage belongs to the window. addEventListener means when something like click, keypress, mousemove, load, resize happens run this function. load means the entire webpage has finished loading (images, CSS, scripts, favicon, everything). Only then does this function begin. Your JavaScript might execute before "<textarea id="input">" exists, and then "document.getElementById("input")" would return null, which would cause errors later. "async () =>" is another arrow function equivalent to "async function() { }". It has no parameters because the load event doesn't need any information here. The async keyword is necessary because you'll use await inside this function. So the entire line means: "When the webpage has completely loaded, execute this asynchronous function."
  try {  //  "Try" begins a try-catch block. Think of it like: "Try to do something. ↓ Did it succeed? ↓ YES Continue. ↓ NO Jump to catch". Instead of crashing your webpage, JavaScript can recover gracefully. Everything between "try {" and "catch (...) {" is protected.

    // Load IPA dictionary
const response = await fetch('./phonitalia.json');  //  fetch() downloads a file from your server. The ./ means "Look in the same folder as this HTML file." Why await? It might take 5 ms 100 ms 500 ms depending on the network. Without await JavaScript would continue immediately before the file had finished downloading. Instead: Download ↓ Wait ↓ Finished ↓ Continue. What is response? The downloaded file isn't returned immediately. Instead you first receive a Response object. Think of it like a package. "Package ↓ Open package ↓ Contents". The Response object contains status code headers body The actual JSON isn't extracted yet.
const rawDictionary = await response.json();  //  Now you open the package. "response.json()" means the downloaded file is plain text (Example { "ciao":"ˈtʃa.o" }) which JavaScript converts into an object. Instead of "text" you now have "{ ciao:"ˈtʃa.o" }" which can be accessed like "rawDictionary.ciao" or "rawDictionary["ciao"]". Again notice await because parsing also takes time.

ipaDictionary = {};  //  You already created an empty dictionary earlier. Why empty it again? Imagine someone later reloads the dictionary. Without this line old entries could remain. This guarantees "Old dictionary ↓ Delete everything ↓ Start fresh".

for (const [key, value] of Object.entries(rawDictionary)) {  //  Suppose "rawDictionary = { ciao:"ˈtʃa.o", pizza:"ˈpit.tsa" }". "Object.entries()" converts it into "[ ["ciao","ˈtʃa.o"], ["pizza","ˈpit.tsa"] ]", an array of pairs. Object.entries() converts it into [ ["ciao","ˈtʃa.o"], ["pizza","ˈpit.tsa"] ] An array of pairs. "for" and "of" means loop over every pair. Iteration 1: key = "ciao" value = "ˈtʃa.o". Iteration 2: key = "pizza" value = "ˈpit.tsa" and so on. Why [key, value]? Each entry looks like ["ciao","ˈtʃa.o"]. The square brackets automatically unpack it. Without destructuring, you'd write: const pair = ... const key = pair[0]; const value = pair[1]. Destructuring saves several lines.
  ipaDictionary[  //  "ipaDictionary[" is simply starting an assignment. It continues on the next lines for readability.
    key.normalize('NFC').toLowerCase()  //  normalize("NFC") Unicode characters can sometimes be represented in different ways. For example è might internally be è or e + accent They look identical. But computers consider them different. normalize("NFC") converts both into the same representation. That prevents mysterious lookup failures. .toLowerCase() converts "CIAO ↓ ciao" and "Pizza ↓ pizza". Now dictionary lookups become case-insensitive.
  ] = value;  //  This finally stores the pronunciation. Example: key↓"CIAO"↓normalize↓"CIAO"↓lowercase↓"ciao"↓Store↓ipaDictionary["ciao"]="ˈtʃa.o". After the loop finishes, your dictionary now contains thousands of Italian words that can be looked up instantly without calling eSpeak.
}  //  In plain English: Download phonitalia.json. Convert it from JSON text into a JavaScript object. Empty any old dictionary. Loop through every word/pronunciation pair. Normalize the spelling (Unicode + lowercase). Store it in ipaDictionary. By the end of this block, your program has a fast in-memory pronunciation dictionary ready to use. The next section is where it initializes eSpeak WebAssembly with await initESpeak(...), explains the print and printErr callbacks, and finally sets wasmReady = true, which is the signal that allows the transcription buttons to work.

  //  console.log(
  //    `Loaded ${Object.keys(ipaDictionary).length} IPA entries`
  //   );

    // Load eSpeak
    await initESpeak({  //  Calls the function that loads and initializes eSpeak NG. "await" means: "Pause this function until eSpeak has completely finished loading." Without await, JavaScript would continue immediately, and the rest of your program might try to use eSpeak before it exists.
      print: () => {},  //  eSpeak normally prints text to its standard output (stdout). The option print tells eSpeak: "Whenever you would normally print something, call this function instead." The function here is () => {} which is an empty arrow function. It accepts whatever eSpeak sends...and deliberately does nothing. So every normal console message is ignored.
      printErr: () => {}  //  Exactly the same idea, except for stderr (error output). Normally eSpeak prints loading messages such as still waiting on run dependencies or dependency: wasm-instantiate Those messages are harmless. Since the function is empty, they are discarded instead of appearing in the console.
    });  // Finishes the initialization call. At this point: the JavaScript wrapper is loaded, the WebAssembly module has been compiled, eSpeak is ready to receive text.

    wasmReady = true;  //  Sets your global flag to indicate that eSpeak is now usable. Earlier you created let wasmReady = false; Now it becomes wasmReady = true; This is what allows waitForWasm() to stop waiting. What happens behind the scenes? When the page first opens: wasmReady = false ↓ The browser downloads espeak-ng.js ↓ The browser downloads espeak-ng.wasm ↓ The WebAssembly binary is compiled. ↓ The eSpeak engine starts. ↓ wasmReady = true; ↓ Now every transcription function can safely call eSpeak.

  //  console.log('eSpeak NG WASM loaded and ready');

  } catch (e) {  //  If anything inside the try block fails, JavaScript jumps here. Possible reasons include: phonitalia.json cannot be found. phonitalia.json contains invalid JSON. espeak-ng.wasm failed to download. espeak-ng.js has an error. WebAssembly failed to initialize. The variable e contains the error object describing what went wrong.
  // delete console
  //  console.error('Error loading:', e);

    outputElem.classList.remove('placeholder');  //  Earlier, the <pre> element had the CSS class placeholder which displays gray placeholder text. This line removes that class. Now the output will be displayed using the normal style.

    outputElem.innerText =  //  Changes the text shown inside <pre id="output">
      'Error loading dictionary or eSpeak.';  //  Displays Error loading dictionary or eSpeak. instead of crashing silently. So if initialization fails, the user immediately knows something went wrong.
  }  //  Ends the catch block.
});  //  Ends the window.addEventListener('load', ...) callback. The entire initialization process is now complete.







  

  
  function printErrFiltered(err) {  //  This helper function is used later whenever eSpeak is run. Instead of hiding all error messages, it filters out only the harmless initialization messages while allowing genuine errors to be displayed. Defines a function that accepts one argument: err which is a string sent by eSpeak to stderr. Example values: still waiting on run dependencies or dependency: wasm-instantiate or an actual error such as cannot open voice file
    if (  //  Begins an if statement. The following conditions decide whether this message should be ignored.
      err.includes('still waiting on run dependencies') ||  //  Checks whether the message contains still waiting on run dependencies. includes() returns either true or false. || Logical OR. 
      err.includes('dependency: wasm-instantiate') ||  //  Looks for another harmless WebAssembly loading message.
      err.includes('(end of list)')  // Checks for another message that eSpeak sometimes prints while starting. Again, it is harmless.
    ) {  //  Ends the condition. 
      return;  //  If any of those three messages was detected...return; Immediately exits the function. Nothing is printed. The harmless message is silently ignored.
    }  //  Ends the if statement. If execution reaches here, it means the message was not one of the ignored ones.
    console.error('eSpeak stderr:', err);  //  Prints the remaining message to the browser console. For example, eSpeak stderr: cannot load voice or eSpeak stderr: unknown option This way, only real problems are shown while startup noise is hidden.
  }  //  Ends the printErrFiltered() function. Its entire purpose is simply: Ignore harmless initialization messages. Display genuine eSpeak errors.







  

  
  async function runESpeak(text) {  //  Defines an asynchronous function named runESpeak. It accepts one parameter, text, which is the Italian text to be transcribed into IPA. Why async? Because running the WebAssembly version of eSpeak takes time. async lets the function pause while waiting for eSpeak to finish without freezing the webpage.
    let ipaOutput = '';  //  Creates an empty string that will collect everything eSpeak prints. Example: Initially: ipaOutput = "" Later eSpeak might output: ˈkaːne After collecting: ipaOutput = "ˈkaːne"
    await initESpeak({  //  Starts eSpeak. Because await is used, JavaScript pauses here until eSpeak has completely finished processing. Without await, the function would immediately continue and return an empty result before eSpeak had time to generate the transcription.
      arguments: ['-v', 'it', '--ipa=3', text],  //  These are exactly the command-line arguments passed to eSpeak. Equivalent terminal command: espeak-ng -v it --ipa=3 "ciao" Each argument means: -v Select a voice. 'it' Choose the Italian voice. So together: -v it means Use the Italian pronunciation rules. '--ipa=3' Tell eSpeak to output IPA instead of speech. The =3 format gives a cleaner IPA transcription. Without this option eSpeak would try to synthesize speech instead. text The text you supplied. If text = "ciao mondo" then eSpeak receives -v it --ipa=3 "ciao mondo"
      print: (text) => {  //  Defines a function that is called every time eSpeak prints normal output. Think of it like: Whenever eSpeak says something, execute this code.
        ipaOutput += text;  //  Append whatever eSpeak printed to the growing string. Example: First callback: text = "ˈtʃa" ipaOutput becomes "ˈtʃa" Second callback: text = "o" Now ipaOutput = "ˈtʃao" Using += means "add to the end."
      },  //  Ends the print callback.
      printErr: printErrFiltered  //  Whenever eSpeak prints an error or warning, it sends it to the printErrFiltered() function instead of directly to the console. That function ignores harmless startup messages but still shows real errors.
    });  //  Finishes the initialization and waits until eSpeak has completed. At this point, ipaOutput contains the complete IPA transcription.

    return ipaOutput  //  Now the code improves eSpeak's output before returning it. Start returning the transcription. Everything after this is a chain of text replacements.
      .replace(/[\u0300-\u036F\u200B-\u200D\uFEFF]/g, '')  //  Removes invisible Unicode characters. These include: combining accents zero-width spaces byte-order marks They can interfere with later processing.
      .replace(/rɾ/g, 'rː')  //  Whenever eSpeak outputs rɾ replace it with rː Why? Italian double rr is a long trill. eSpeak sometimes represents it as rɾ Your application prefers rː
      .replace(/mm/g, 'mː')
      .replace(/ff/g, 'fː')
      .replace(/vv/g, 'vː')
      .replace(/ll/g, 'lː')
      .replace(/kk/g, 'kː')
      .replace(/nn/g, 'nː')
      .replace(/ɲɲ/g, 'ɲː')
      .replace(/oo/g, 'oː')      
      .replace(/ss/g, 'sː')
      .replace(/tt/g, 't')
      .replace(/dd/g, 'd')
      .replace(/ɾ/g, 'r')
      .replace(/ɪ/g, 'i')
      .replace(/ʊ/g, 'u')
      .replace(/ɡ/g, 'g')
      .trim();  //  Removes whitespace at the beginning and end. Example: "   ˈkaːne   " becomes "ˈkaːne"
  }  //  This function does three major jobs: Sends text to eSpeak. Waits until eSpeak produces IPA. Cleans and normalizes the IPA so the rest of your G2P code receives a consistent transcription. This normalization is important because applyG2PMapping() expects IPA in a very specific format. Without these replacements, many mappings would fail because eSpeak's output would not exactly match the symbols your mapping code is designed to recognize.






  

  
  
  function showPlaceholder() {  //  Defines a normal (non-async) function named showPlaceholder. Its job is to reset the output area to its default empty state.
    outputElem.className = 'placeholder';  //  Replaces the CSS class of the <pre> output element with "placeholder". This causes the CSS rule pre.placeholder { color: grey; user-select: none; } to become active, making the text appear as a grey placeholder instead of actual transcription output.
    outputElem.innerText = 'Transcription';  //  Changes the visible text inside the output box to Transcription This is what the user sees before any transcription has been generated.
  }



  

  function showProgressPlaceholder() {  //  Defines another helper function. Unlike the previous one, this one is used while the program is still working.
    outputElem.className = 'placeholder';  //  Again switches the output element into placeholder mode. The text becomes grey and unselectable.
    outputElem.innerText = 'Transcription in progress...';  //  Displays Transcription in progress... so the user knows that eSpeak is still processing. This is important because WebAssembly can take a few seconds on long texts.
  }



  

  function setOutput(text) {  //  Defines a function that displays the finished transcription. Unlike the previous two functions, this one removes placeholder styling.
    outputElem.classList.remove('placeholder');  //  Removes the "placeholder" CSS class. This means the output will now use the normal CSS rule: pre:not(.placeholder) instead of pre.placeholder The text becomes selectable and uses the normal transcription color.
    outputElem.innerText = text;  //  Displays whatever string was passed into the function. Example: setOutput("ˈka.ne"); The user will see ˈka.ne
  }




  
// Helper: Split text into manageable chunks (max 500 characters)
function splitTextByLength(text, maxLength = 500) {  //  Creates a helper function that splits very long input into smaller pieces. The second parameter has a default value: maxLength = 500 meaning that if you simply call splitTextByLength(text) JavaScript automatically uses 500
  const chunks = [];  //  Creates an empty array. Each piece of the text will later be stored here. Example: [ "First 500 characters...", "Next 500 characters...", "Last part..." ]
  let start = 0;  //  Keeps track of where the next chunk begins. Initially, we start at the first character.
  while (start < text.length) {  //  Loops until we've reached the end of the input. Example: If the text has 1500 characters the loop runs approximately three times.
    let end = start + maxLength;  //  Assumes that the current chunk ends 500 characters later. Suppose start = 0 then end = 500 Next iteration: start = 500 end = 1000 and so on.

    // Try not to cut off words in the middle
    if (end < text.length) {  //  Checks whether this is not the final chunk. If we're already near the end of the text, there's no need to adjust anything.
      const lastSpace = text.lastIndexOf(' ', end);  //  Looks backwards from position end until it finds the nearest space. Suppose: The quick brown fox jumps over the lazy dog If character 500 happens to be in the middle of jumps this finds the previous space instead. So the split occurs between words rather than inside them.
      if (lastSpace > start) {  //  Makes sure a suitable space was actually found. Without this check, the code might accidentally move backwards too far.
        end = lastSpace;  //  Moves the split point to the previous space. Instead of extraordi nary you get extraordinary which is much cleaner.
      }
    }

    chunks.push(text.slice(start, end));  //  Extracts the substring between start and end and stores it. Example: text = "The cat sat on the mat." might produce "The cat sat"
    start = end;  //  Moves the starting position to the end of the previous chunk. Now the next loop continues from there.
  }  //  Ends the while loop.
  return chunks;  //  Returns the completed array. Example result: [ "First chunk...", "Second chunk...", "Third chunk..." ]
}  //  End of the function. Why split into chunks? Your program sends text to eSpeak through WebAssembly. Very large strings can: consume lots of memory, become slower, occasionally exceed internal limits. Instead of sending 5000 characters at once, your code sends 500 500 500 ... and later joins the results back together. The user never notices the splitting, but the program becomes much more reliable.









  
// ===================================================================
//  NEW BUTTON: G2P AFI
//  Outputs ONLY IPA for words that have valid G2P mapping,
//  Words without mapping remain unchanged.
// ===================================================================
document.getElementById('afi').addEventListener('click', async () => {  //  What does this line do? document.getElementById('afi') Searches the HTML page for the element whose ID is "afi". That element is your first button: <button id="afi"> The browser returns a reference to that button. addEventListener('click', ...) Attaches an event listener. An event listener tells JavaScript: "Whenever someone clicks this button, execute the following function." Nothing happens yet. The code simply waits until the user presses the button. async () => { Creates an asynchronous arrow function. Because it is async, the function is allowed to use await. Execution will look like this: User clicks button │ ▼ JavaScript starts this function │ ▼ Waits for eSpeak if necessary │ ▼ Processes the text │ ▼ Displays IPA
  showProgressPlaceholder();  //  Calls the helper function explained earlier. This immediately changes the output area to Transcription in progress... This gives instant feedback so the user knows the program is working. Without this line, the page would appear frozen during long transcriptions.

    await waitForWasm();  //  Now the program waits until eSpeak has completely finished loading. Remember that earlier you created let wasmReady = false; When the page loads: wasmReady = false Later: await initESpeak(...) loads the WebAssembly module. Finally, wasmReady = true; is executed. Only then does waitForWasm() return. Without this line, someone could click the button before eSpeak was ready and the transcription would fail.

  const rawInput = normalizeCurlyApostrophes(  //  This line prepares the user's text before any transcription happens. Let's break it apart. Earlier you defined function normalizeCurlyApostrophes(text) It converts ’ ‘ into ' This prevents problems caused by copying text from Word or websites. Example Input: l’acqua becomes l'acqua
    inputElem.value.trim()  //  inputElem refers to the <textarea>. .value retrieves everything the user typed. Example: L'acqua è fredda. Removes whitespace from both ends. Internal spaces stay exactly the same.
  ).normalize('NFC');  //  .normalize('NFC') Unicode allows some accented letters to be stored in multiple ways. For example, è may actually be stored as e + accent instead of one character. NFC converts everything into the standard composed form. That makes comparisons against your dictionary reliable. The final result is stored in const rawInput which now contains a clean version of the user's text.

  // if (!wasmReady) {
   // alert("Please wait, WASM is still loading...");
  //  return;
  //  }


  if (!rawInput) {  //  Checks whether the input is empty. The ! means "not". If rawInput == "" then !rawInput is true. Examples that count as empty: "" "      " because .trim() already removed the spaces.
    showPlaceholder();  //  Since there is no text to transcribe, restore the default placeholder: Transcription
    return;  //  Stops the function immediately. Nothing else below will execute. This prevents unnecessary processing.
  }  //  Ends the if statement.

    const chunks = splitTextByLength(rawInput, 500);  //  function returns something like [ "...first 500...", "...second 500...", "...third 500...", "...fourth 500..." ] Each chunk will later be processed separately.

          /^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u.test(token);

        if (!isWord) {
          converted.push(token);
          continue;
        }

        let ipa = ipaMap.get(token) || "";
        let mapped = applyG2PMapping(token, ipa);

        // ----------------------------------------------------------
        // IF MAPPING FAILS → RESYNC AND RE-RUN ESPEAK FROM NEXT WORD
        // ----------------------------------------------------------
        if (mapped === null) {
        // delete
        //  console.warn("G2P failed on:", token);

          // Find next real word AFTER the current token
          let nextWordIndex = t + 1;
          while (
            nextWordIndex < tokens.length &&
            !/^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u
              .test(tokens[nextWordIndex])
          ) {
            nextWordIndex++;
          }

          // No more words → output original and continue
          if (nextWordIndex >= tokens.length) {
            converted.push(token);
            continue;
          }

          // Collect remaining words starting from that next real word
          const remainingWords = tokens
            .slice(nextWordIndex)
            .filter(tt =>
              /^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u.test(tt)
            );
           // delete console
          // console.log("Re-running eSpeak for:", remainingWords);

          // Rebuild IPA map for remaining sequence
          ipaMap = await computeIPAMap(remainingWords);

          // Retry mapping the *current* token
          ipa = ipaMap.get(token) || "";
          mapped = applyG2PMapping(token, ipa);
        }
          
          // If still failing, output original
          if (mapped === null) {
            converted.push(token);
            continue;
          }
        

        // Validate allowed IPA mapping
        mapped = validateOrReturnOriginal(token, mapped);

        // Pull all IPA inside parentheses
        const ipaPieces = [...mapped.matchAll(/\(([^()]*)\)/g)];
        const ipaString = ipaPieces.map(x => x[1]).join("");

        if (!ipaString) {
          converted.push(token);
          continue;
        }

        // Final inline form: WORD (IPA)
        converted.push(`${token} (${ipaString})`);
      }

      // ------------------------------------------------------------
      // Reconstruct output preserving EXACT original whitespace
      // ------------------------------------------------------------
      let rebuilt = '';
      let pos = 0;

      for (const token of tokens) {
        while (chunk[pos] && /\s/.test(chunk[pos])) {
          rebuilt += chunk[pos++];
        }
        rebuilt += converted.shift();
        pos += token.length;
      }

      finalResult += rebuilt;
    }

    setOutput(finalResult.trim());

  } catch (e) {
    console.error("Error in G2P Inline:", e);
    setOutput("Error during G2P Inline processing: " + e.message);
  }
});



function getDictionaryIPA(word) {

async function computeIPAMap(words) {

  const map = new Map();

  const espeakWords = [];

  for (const word of words) {

    const dictIPA = getDictionaryIPA(word);

    if (dictIPA) {

      map.set(word, dictIPA);

    //    console.log(
     //   `[DICT] ${word} → ${dictIPA}`
    //    );

    } else {

      espeakWords.push(word);
    }
  }

  if (espeakWords.length > 0) {

    const unique = [...new Set(espeakWords)];

    const marked = unique.join("|");

    const ipaRaw = await runESpeak(marked);

    const ipaClean =
      ipaRaw.replace(/\|/g, " ").trim();

    const ipaWords =
      ipaClean.split(/\s+/);

    for (let i = 0; i < unique.length; i++) {

      map.set(
        unique[i],
        ipaWords[i] || ""
      );
    // delete
    //  console.log(
     //   `[ESPEAK] ${unique[i]} → ${ipaWords[i]}`
     //  );
    }
  }

  return map;
}
