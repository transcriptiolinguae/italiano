<script type="module">
  import initESpeak from './espeak-ng.js';

// eSpeak voices
const voices = {  //  creates a JavaScript object called voices. Its purpose in your program is to connect your website's language codes with the eSpeak voice names that should be used for pronunciation. 1. const const voices = ... const creates a variable that cannot be reassigned. So this is allowed: voices.it but this is not: voices = {}; You cannot replace the whole object. However, the contents of the object can technically be changed: voices.it = "something else"; would work. 2. The object { } The curly brackets create an object: { it: "it", en: "en", de: "de", fr: "fr" } An object stores key → value pairs. The structure is: key : value So your object contains: Key	Value it	"it" en	"en" de	"de" fr	"fr" The left side is the name you use in your program. The right side is the value you want to retrieve. 3. Why are both sides the same? You might ask: Why write: it: "it" instead of something different? Because eSpeak voice names happen to use the same abbreviations. For example: it: "it" means: Your program language code:  it | v eSpeak voice name:          it When eSpeak receives: -v it it loads the Italian pronunciation rules. 4. How it is used in your code You have this function: function getVoice() { return voices[currentLanguage]; } This uses the current language to look up the correct eSpeak voice. At the beginning: currentLanguage = "it"; So: voices[currentLanguage] becomes: voices["it"] which returns: "it" Therefore: getVoice() returns: "it" Then your eSpeak command: arguments: [ '-v', getVoice(), '--ipa=3', text ] becomes: arguments: [ '-v', 'it', '--ipa=3', text ] which is equivalent to: espeak-ng -v it --ipa=3 "ciao" and eSpeak knows to use Italian pronunciation. 5. What happens when the user changes language? Suppose the user selects German: currentLanguage = "de"; Now: voices[currentLanguage] becomes: voices["de"] which returns: "de" Now eSpeak receives: espeak-ng -v de --ipa=3 "Hallo" and uses German pronunciation rules. 6. Why not simply write currentLanguage directly? You could technically do: function getVoice() { return currentLanguage; } and in your current setup it would work because: it → it en → en de → de fr → fr are identical. However, the object gives you flexibility. For example, if later eSpeak uses different names: const voices = { it: "italian", en: "en-us", de: "german", fr: "french" }; you would not need to change the rest of your program. Your language selector could still use: <option value="en">English</option> while eSpeak receives: -v en-us So voices acts as a translation table between your website languages and eSpeak voice identifiers.
    it: "it",
    en: "en",
    de: "de",
    fr: "fr"
};
  
// Dictionary files
const dictionaries = {  //  his object maps each language code to its IPA dictionary file. It is connected to the code through: function getDictionaryFile() { return dictionaries[currentLanguage]; } currentLanguage stores the selected language. getDictionaryFile() uses it to choose the correct dictionary. Example: currentLanguage = "it"; then: getDictionaryFile() returns: "./phonitalia.json" This file is loaded by: const response = await fetch(getDictionaryFile()); inside loadDictionary(), which fills ipaDictionary with word → IPA entries. Connection flow: Language selection → currentLanguage → getDictionaryFile() → dictionaries object → load JSON IPA dictionary.
    it: "./phonitalia.json",  
    en: "./phonenglish.json",
    de: "./phongerman.json",
    fr: "./phonfrench.json"
};

  const outputElem = document.getElementById('output');  // This looks inside your HTML for "<pre id="output">" and stores it. Why const? Because this variable never changes. It always points to the same HTML element.

  const inputElem = document.getElementById('input');

  
// g2p & validate
let languageApplyG2P = null;  //  This is much more important. It will later store the G2P function from the selected language file. At startup you do: const language = await import(`./${currentLanguage}.js`); languageApplyG2P = language.applyG2PMapping; Since: currentLanguage = "it"; JavaScript loads: ./it.js Inside it.js you probably have something like: export function applyG2PMapping(word, ipa) { ... } Then this line: languageApplyG2P = language.applyG2PMapping; copies that function into your variable. Before loading: languageApplyG2P = null; After loading Italian: languageApplyG2P = function applyG2PMapping(word, ipa) { ... } Now your generic HTML code can call: languageApplyG2P(token, ipa); without knowing whether it is Italian, English, German, or French.
let languageValidate = null;  //  This works the same way. Later: languageValidate = language.validateOrReturnOriginal; loads the validation function from the language file. For example, it.js might contain: export function validateOrReturnOriginal(word, mapped) { if (mapped.includes("c(z)")) { return word; } return mapped; } Then your main file calls: mapped = validateOrReturnOriginal(token, mapped); Your wrapper function: function validateOrReturnOriginal(originalWord, mappedString) { if (languageValidate) { return languageValidate(originalWord, mappedString); } return mappedString; } checks: if (languageValidate) Meaning: "Has a language-specific validator been loaded?" If yes: return languageValidate(originalWord, mappedString); Use the language rules. If no: return mappedString; Do nothing.


// Current language
let currentLanguage = "it";  //  This stores the currently selected language. At the beginning: currentLanguage = "it"; means: Italian is active. So this line: await import(`./${currentLanguage}.js`); becomes: await import("./it.js"); When the user changes the dropdown: document .getElementById("language") .addEventListener("change", async (e) => { setLanguage(e.target.value); Suppose the user selects German. The <select> gives: e.target.value = "de" Then: setLanguage("de"); runs: function setLanguage(lang) { currentLanguage = lang; } Now: currentLanguage = "de"; Then your code loads: ./de.js and replaces: languageApplyG2P languageValidate with German versions.


let wasmReady = false;  // This creates a variable. Unlike const, let allows changing the value later.

// IPA dictionary
let ipaDictionary = {};  //  let creates a variable whose value can change later. {} creates an empty JavaScript object. Think of it as a dictionary or lookup table. Initially it contains nothing. Later it will become something like { "ciao": "ˈtʃa.o" }. Then your code can instantly look up pronunciations.







  



  
window.addEventListener('load', async () => {  //  This function runs when the webpage finishes loading. Its job is to prepare everything needed before the user can press the transcription buttons. window = the browser page. load = an event that happens when the HTML, images, scripts, and resources are fully loaded. When loading finishes, the function inside runs. async allows the function to use await because loading dictionaries and eSpeak takes time. Connection: This runs before the user clicks afi, testoafi, or g2p. It prepares ipaDictionary, G2P functions, and eSpeak.

    try {  //  Starts error handling. If something fails inside this block (missing JSON, failed import, eSpeak error), execution jumps to catch.

        // Load pronunciation dictionary
        await loadDictionary();  //  Calls your function: async function loadDictionary() { const response = await fetch(getDictionaryFile()); ... } What happens: getDictionaryFile() checks: currentLanguage Initially: currentLanguage = "it"; so: getDictionaryFile() returns: "./phonitalia.json" fetch() loads that JSON file. The entries are stored in: ipaDictionary Example: ipaDictionary = { "ciao": "ˈtʃao", "cane": "ˈkane" } Connection: currentLanguage ↓ getDictionaryFile() ↓ phonitalia.json ↓ ipaDictionary ↓ getDictionaryIPA() ↓ computeIPAMap()

      // g2p & validate
const language = await import(`./${currentLanguage}.js`);  //  Dynamically imports the language file. Because: currentLanguage = "it" this becomes: import("./it.js") That file contains your Italian rules: export function applyG2PMapping() export function validateOrReturnOriginal()

languageApplyG2P = language.applyG2PMapping;  //  Takes the G2P function from the language file and stores it globally. Before: languageApplyG2P = null; After: languageApplyG2P = applyG2PMapping function from it.js Connection: Later when you run: applyG2PMapping(token, ipa) your wrapper calls: languageApplyG2P(originalWord, ipa) which uses the current language rules.
languageValidate = language.validateOrReturnOriginal;  //  Stores the validation function from the language file. Before: languageValidate = null; After: languageValidate = validateOrReturnOriginal from it.js Connection: Later: validateOrReturnOriginal(token, mapped) calls: languageValidate(token, mapped) to check if the G2P alignment is valid.
      
        // Load eSpeak
        await initESpeak({  //  Starts loading eSpeak. Your imported module: import initESpeak from './espeak-ng.js'; provides this function.

            print: () => {},  //  print: () => {}, Defines what happens when eSpeak prints normal output during initialization. () means no parameters. {} means do nothing. It hides startup messages.

            printErr: () => {}  //  Defines what happens when eSpeak prints errors during initialization. Also ignored during startup.

        });  //  Waits until eSpeak finishes loading. After this line, eSpeak is ready to generate IP

        wasmReady = true;  //  Changes: Before: wasmReady = false; After: wasmReady = true; Connection: Your buttons use: await waitForWasm(); waitForWasm() waits until this becomes true. So this prevents the user from running transcription before eSpeak is ready.

  } catch (e) {  //  If anything above fails, this runs. Examples: dictionary file missing language file missing eSpeak loading failure

    console.error("STARTUP ERROR:", e);  //  Prints the error in the browser console for debugging.

    outputElem.classList.remove('placeholder');  //  Removes the grey placeholder style from the output box.

    outputElem.innerText =
        'Error loading dictionary or eSpeak: ' + e.message;  //  Displays the error message to the user. Example: Error loading dictionary or eSpeak: Failed to fetch

}
});  //  Complete connection flow Page loads ↓ load event fires ↓ loadDictionary() ↓ phonitalia.json loaded ↓ ipaDictionary filled ↓ import("./it.js") ↓ G2P + validation functions loaded ↓ initESpeak() ↓ WebAssembly eSpeak ready ↓ wasmReady = true ↓ User can press transcription buttons In short: this startup function loads the language dictionary, loads the correct G2P rules, starts eSpeak, and prepares the application for transcription.




  

  




function setLanguage(lang) {  //  Updates the global currentLanguage variable with the language selected by the user. Other functions use this value to know which language settings to load.
    currentLanguage = lang;
}

function getDictionaryFile() {  //  Gets the dictionary file path from the dictionaries object. Example: if currentLanguage = "en", it returns "./phonenglish.json". Used by loadDictionary() to load the correct pronunciation dictionary.
    return dictionaries[currentLanguage];
}

function getVoice() {  //  Gets the voice/language code from the voices object. Example: if currentLanguage = "de", it returns "de". Used by the speech system (eSpeak) to select the correct pronunciation voice.
    return voices[currentLanguage];
}  //  Connection with other code: Language dropdown calls setLanguage() when the user changes language. loadDictionary() uses getDictionaryFile() to load the matching JSON dictionary. Speech generation uses getVoice() to select the correct eSpeak voice. These functions connect the selected language with dictionaries, G2P rules, and speech output.


  

  // Normalize curly apostrophes to straight apostrophes
function normalizeCurlyApostrophes(text) {  // The parameter text will contain whatever string you pass into the function.
  return text.replace(/[’‘]/g, "'");  // Match one character from the list in [] square brackets, where "g" means replace globally every word with character in quotes "'".
}  
  


 

  

  
  function printErrFiltered(err) {  //  This helper function is used later whenever eSpeak is run. Instead of hiding all error messages, it filters out only the harmless initialization messages while allowing genuine errors to be displayed. Defines a function that accepts one argument: err which is a string sent by eSpeak to stderr. Example values: still waiting on run dependencies or dependency: wasm-instantiate or an actual error such as cannot open voice file
    if (  //  Begins an if statement. The following conditions decide whether this message should be ignored.
      err.includes('still waiting on run dependencies') ||  //  Checks whether the message contains still waiting on run dependencies. includes() returns either true or false. || Logical OR. 
      err.includes('dependency: wasm-instantiate') ||  //  Looks for another harmless WebAssembly loading message.
      err.includes('(end of list)')  // Checks for another message that eSpeak sometimes prints while starting. Again, it is harmless.
    ) {  //  Ends the condition. 
      return;  //  If any of those three messages was detected...return; Immediately exits the function. Nothing is printed. The harmless message is silently ignored.
    }  //  Ends the if statement. If execution reaches here, it means the message was not one of the ignored ones.
    console.error('eSpeak stderr:', err);  //  Prints the remaining message to the browser console. For example, eSpeak stderr: cannot load voice or eSpeak stderr: unknown option This way, only real problems are shown while startup noise is hidden.
  }  //  Ends the printErrFiltered() function. Its entire purpose is simply: Ignore harmless initialization messages. Display genuine eSpeak errors.






  
  
  function showPlaceholder() {  //  Defines a normal (non-async) function named showPlaceholder. Its job is to reset the output area to its default empty state.
    outputElem.className = 'placeholder';  //  Replaces the CSS class of the <pre> output element with "placeholder". This causes the CSS rule pre.placeholder { color: grey; user-select: none; } to become active, making the text appear as a grey placeholder instead of actual transcription output.
    outputElem.innerText = 'Transcription';  //  Changes the visible text inside the output box to Transcription This is what the user sees before any transcription has been generated.
  }



  

  function showProgressPlaceholder() {  //  Defines another helper function. Unlike the previous one, this one is used while the program is still working.
    outputElem.className = 'placeholder';  //  Again switches the output element into placeholder mode. The text becomes grey and unselectable.
    outputElem.innerText = 'Transcription in progress...';  //  Displays Transcription in progress... so the user knows that eSpeak is still processing. This is important because WebAssembly can take a few seconds on long texts.
  }



  

  function setOutput(text) {  //  Defines a function that displays the finished transcription. Unlike the previous two functions, this one removes placeholder styling.
    outputElem.classList.remove('placeholder');  //  Removes the "placeholder" CSS class. This means the output will now use the normal CSS rule: pre:not(.placeholder) instead of pre.placeholder The text becomes selectable and uses the normal transcription color.
    outputElem.innerText = text;  //  Displays whatever string was passed into the function. Example: setOutput("ˈka.ne"); The user will see ˈka.ne
  }




  
// Helper: Split text into manageable chunks (max 500 characters)
function splitTextByLength(text, maxLength = 500) {  //  Creates a helper function that splits very long input into smaller pieces. The second parameter has a default value: maxLength = 500 meaning that if you simply call splitTextByLength(text) JavaScript automatically uses 500
  const chunks = [];  //  Creates an empty array. Each piece of the text will later be stored here. Example: [ "First 500 characters...", "Next 500 characters...", "Last part..." ]
  let start = 0;  //  Keeps track of where the next chunk begins. Initially, we start at the first character.
  while (start < text.length) {  //  Loops until we've reached the end of the input. Example: If the text has 1500 characters the loop runs approximately three times.
    let end = start + maxLength;  //  Assumes that the current chunk ends 500 characters later. Suppose start = 0 then end = 500 Next iteration: start = 500 end = 1000 and so on.

    // Try not to cut off words in the middle
    if (end < text.length) {  //  Checks whether this is not the final chunk. If we're already near the end of the text, there's no need to adjust anything.
      const lastSpace = text.lastIndexOf(' ', end);  //  Looks backwards from position end until it finds the nearest space. Suppose: The quick brown fox jumps over the lazy dog If character 500 happens to be in the middle of jumps this finds the previous space instead. So the split occurs between words rather than inside them.
      if (lastSpace > start) {  //  Makes sure a suitable space was actually found. Without this check, the code might accidentally move backwards too far.
        end = lastSpace;  //  Moves the split point to the previous space. Instead of extraordi nary you get extraordinary which is much cleaner.
      }
    }
    chunks.push(text.slice(start, end));  //  Extracts the substring between start and end and stores it. Example: text = "The cat sat on the mat." might produce "The cat sat"
    start = end;  //  Moves the starting position to the end of the previous chunk. Now the next loop continues from there.
  }  //  Ends the while loop.
  return chunks;  //  Returns the completed array. Example result: [ "First chunk...", "Second chunk...", "Third chunk..." ]
}  //  End of the function. Why split into chunks? Your program sends text to eSpeak through WebAssembly. Very large strings can: consume lots of memory, become slower, occasionally exceed internal limits. Instead of sending 5000 characters at once, your code sends 500 500 500 ... and later joins the results back together. The user never notices the splitting, but the program becomes much more reliable.





function getDictionaryIPA(word) {  //  Defines a new function named getDictionaryIPA. It accepts one parameter: word. word is expected to be a single word such as: "ciao" or "Perché" The function's job is simple: Look inside your custom IPA dictionary (phonitalia.json) and return the IPA transcription if the word exists.

  const key = word  //  Creates a new constant named key. This variable will contain a normalized version of the word before searching the dictionary. It does not modify the original word. Example: word = "Caffè" After this line: word = "Caffè" key  = (still being built)
    .normalize('NFC')  //  Normalizes Unicode characters into NFC (Normalization Form C). This is extremely important because some accented characters can be stored in two different ways. For example, these two strings look identical: é and e + ◌́ One is a single Unicode character. The other is the letter plus a combining accent. Visually they are identical, but JavaScript considers them different strings. Calling .normalize('NFC') converts both into exactly the same representation. Example: "Caffè" becomes "Caffè" Now dictionary lookup becomes reliable.
    .toLowerCase();  //  Converts the normalized word to lowercase. Examples: "CIAO" ↓ "ciao" "Perché" ↓ "perché" This means your dictionary only needs one entry: "ciao" instead of "Ciao" "CIAO" "CiAo" "cIaO" ... Everything becomes lowercase before searching. After these two operations together: word = "Perché" becomes key = "perché"

  return ipaDictionary[key] || null;  //  This is the actual dictionary lookup. ipaDictionary is the object you loaded earlier from phonitalia.json. Suppose it contains: ipaDictionary = { "ciao": "ˈtʃao", "cane": "ˈkane", "gli": "ʎi" } JavaScript checks: ipaDictionary[key] If key = "ciao" then ipaDictionary["ciao"] returns ˈtʃao The function immediately returns that IPA. If the word is not found: ipaDictionary["computer"] returns undefined The operator || means: "If the value on the left is missing or false, use the value on the right." So undefined || null becomes null The function therefore returns null to indicate: "This word is not in the custom dictionary." This is the actual dictionary lookup. Remember that earlier your code loaded ipaDictionary = { "ciao": "tʃao", "gli": "ʎi", "occhi": "ɔkːi" } Now JavaScript checks ipaDictionary[key] Suppose key = "ciao" Then it evaluates ipaDictionary["ciao"] which returns "tʃao" So the function returns return "tʃao"; If the word is not in the dictionary: key = "javascript" then ipaDictionary["javascript"] is undefined The operator || means "if the thing on the left is missing or false, use the thing on the right." So undefined || null becomes null Therefore the function returns null instead of undefined. Returning null is intentional because later your code checks if (dictIPA) { ... } else { ... } or if (dictIPA === null) to decide whether to call eSpeak.
}






  
   // g2p & validate 

function validateOrReturnOriginal(originalWord, mappedString) {  //  It accepts two parameters: originalWord — the original spelling of the word. Example: ciao mappedString — the grapheme-to-phoneme alignment produced by applyG2PMapping(). Example: c(tʃ)i(a)a(o)o() or g(g)l(ʎ)i() The function will inspect mappedString and decide: ✔ keep it ✘ reject it and return the original word. Takes two inputs: originalWord: the original written word. mappedString: the IPA/G2P result created from that word.
    if (languageValidate) {
        return languageValidate(originalWord, mappedString);  //  If the selected language has a custom validation function, it uses it. The validation checks if the G2P result is correct.
    }

 return mappedString;  //  If no language-specific validator exists, it accepts the generated pronunciation. Connection with other code: languageValidate is loaded from the language file (en.js, it.js, etc.). It checks the output created by applyG2PMapping(). Prevents incorrect pronunciation mappings from being used.

}



 // g2p & validate 
  
function applyG2PMapping(text, ipa) {  //  Takes the original text and its IPA representation.
    if (languageApplyG2P) {  
        return languageApplyG2P(text, ipa);  //  If the selected language has a G2P mapping function, it applies language-specific pronunciation rules.
    }
    return ipa;  //  If no custom rules exist, it returns the original IPA unchanged. Connection with other code: languageApplyG2P is loaded dynamically from the selected language file. It modifies IPA output according to language rules. Its result is then checked by validateOrReturnOriginal() before final speech output.
}






 async function runESpeak(text) {  //  Defines an asynchronous function named runESpeak. It accepts one parameter, text, which is the Italian text to be transcribed into IPA. Why async? Because running the WebAssembly version of eSpeak takes time. async lets the function pause while waiting for eSpeak to finish without freezing the webpage.

   
   let ipaOutput = '';  //  Creates an empty string that will collect everything eSpeak prints. Example: Initially: ipaOutput = "" Later eSpeak might output: ˈkaːne After collecting: ipaOutput = "ˈkaːne"
    await initESpeak({  //  Starts eSpeak. Because await is used, JavaScript pauses here until eSpeak has completely finished processing. Without await, the function would immediately continue and return an empty result before eSpeak had time to generate the transcription.

        // show in console how words map 2026 delete
    // console.log("WORD:", token);
    // console.log("IPA:", ipa);
    // console.log("MAPPED:", mapped);
        
        // If mapping fails → recover
        
        if (mapped === null) {  //  This checks whether applyG2PMapping() failed. Earlier, you called: let mapped = applyG2PMapping(token, ipa); Normally, mapped contains something like ci(tʃ)a(a)o(o) However, if the function cannot correctly align the spelling with the IPA transcription, it returns null rather than an incorrect mapping. This if statement catches that failure.

          // Find next real word

              .test(tokens[nextWordIndex])  //  Example Suppose your tokens are [ "Ciao", ",", "come", "stai", "?" ] Imagine we're processing "Ciao" The search begins at "," Is it a word? No. Move forward. Now "come" Is it a word? Yes. The loop stops. Now nextWordIndex points to "come".
          ) {

            .slice(t)  //  Take everything from the next word onward. Example: Original tokens [ "Ciao", ",", "come", "stai", "." ] If nextWordIndex = 2 then slice(2) returns [ "come", "stai", "." ]
            .filter(tt =>  //  Now remove anything that isn't a word.

            );

        }

// Only validate words that came from eSpeak
//  if (!getDictionaryIPA(token)) {
  mapped = validateOrReturnOriginal(token, mapped);
//  }  //  The variable mapped overwrites the allready existing mapped variable with validated mapping. The next step is to verify that every letter-to-sound mapping is valid. This calls the function validateOrReturnOriginal(). It receives two pieces of information: token — the original word. mapped — the grapheme-to-phoneme alignment. For example: token  = "ciao" mapped = "ci(tʃ)a(a)o(o)" The function now examines every mapping. Why validate? Although applyG2PMapping() tries to align the spelling and pronunciation correctly, it doesn't know whether every mapping is linguistically acceptable. For example: c(z) would be suspicious because an Italian c is never pronounced z. Instead of accepting impossible mappings, your validator checks them against a list of allowed pronunciations. If every mapping is valid, the function simply returns the original string. Example: ci(tʃ)a(a)o(o) ↓ ci(tʃ)a(a)o(o) Nothing changes. If an illegal mapping is found, the function instead returns the original word. Example: token = "ciao" mapped = "c(z)i(i)a(a)o(o)" ↓ returns ciao This prevents displaying incorrect IPA.

        const ipaPieces = [...mapped.matchAll(/\(([^()]*)\)/g)];  //  This line is one of the cleverest parts of the program. Instead of looking at the letters, it extracts everything inside parentheses. Suppose mapped = ci(tʃ)a(a)o(o) The regular expression searches for (...) everywhere. It finds (tʃ) (a) (o) Understanding the regular expression /\(([^()]*)\)/g Let's examine it piece by piece. \( Match a literal opening parenthesis. Example: ( ([^()]*) This is the important part. It means: Capture everything that is not another parenthesis. For (tʃ) it captures tʃ For (a) it captures a \) Match the closing parenthesis. g The global flag. Without it, JavaScript would stop after the first match. With it, it continues through the entire string. What does matchAll() return? Suppose mapped = ci(tʃ)a(a)o(o) Then mapped.matchAll(...) returns something conceptually like [ "(tʃ)", "(a)", "(o)" ] along with additional information about each match. Why use [...]? [...mapped.matchAll(...)] matchAll() returns an iterator. An iterator isn't a normal array. The spread operator ... converts it into a regular JavaScript array. Now you can use methods like map() on it. Store the IPA matches const ipaPieces = ... Now ipaPieces contains every IPA symbol that was inside parentheses. Conceptually, ipaPieces looks like [ "(tʃ)", "(a)", "(o)" ]

      let pos = 0;  //  Creates a variable that remembers where we currently are in the original text. This is extremely important because the program wants to preserve every space exactly as the user typed it. Imagine the original input was Ciao,   come! Notice there are three spaces after the comma. Those spaces are not stored inside tokens. Instead, they still exist inside the original string (chunk). pos keeps track of where we are while reading that original string.

          rebuilt += chunk[pos++];  //  Copy the whitespace. This line does two things simultaneously. First, rebuilt += chunk[pos]; copies the character into the output. Then pos++; moves to the next character. Because of the post-increment (pos++), both happen in one statement. Example Suppose chunk C i a o , _ _ c ↑ pos The current character is " " After executing rebuilt += chunk[pos++]; the output receives " " and pos moves one position forward. If there are four spaces, the loop repeats four times, preserving them perfectly.
        }
        rebuilt += converted.shift();  //  Insert the converted token. Now comes the important step. converted contains the processed tokens. For example, converted = [ "tʃao", ",", "ˈkome", "?" ] shift() removes and returns the first element. So converted.shift() returns tʃao and the array becomes [ ",", "ˈkome", "?" ] That returned value is immediately appended to the rebuilt sentence. Why use shift()? Because the order of converted already matches the order of tokens. Each iteration consumes exactly one converted token. It's an elegant way to keep both arrays synchronized.
        pos += token.length;  //  Advance past the original token. Remember, we copied the replacement word, not the original one. However, we're still reading from the original string (chunk). We therefore need to skip over the characters belonging to the original token. Example Original text Ciao, come After copying tʃao we still need to move past Ciao inside the original string. Since token.length is 4 pos advances by four characters. Now it's pointing at the comma. After the loop finishes Eventually, every original token has been replaced. Suppose Original Ciao, come stai? After reconstruction, rebuilt becomes tʃao, ˈkome stai? Notice that commas stayed exactly where they were, spaces stayed exactly where they were, punctuation stayed exactly where it was, only the words changed.

document.getElementById('testoafi').addEventListener('click', async () => {
  showProgressPlaceholder();

    const chunks = splitTextByLength(rawInput, 500);

    for (const chunk of chunks) {

      // Tokenize text
      const tokens = chunk.match(
        /[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+(?:'[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+)*|[0-9]+(?:[.,][0-9]+)?|[^\s]/gu

        /^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u.test(t)
      );

      // Initial IPA pass
      let ipaMap = await computeIPAMap(words);

      const converted = [];

      for (let t = 0; t < tokens.length; t++) {

        const token = tokens[t];
        const isWord =
          /^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u.test(token);

        if (!isWord) {
          converted.push(token);
          continue;
        }

        let ipa = ipaMap.get(token) || "";
        let mapped = applyG2PMapping(token, ipa);

        // IF MAPPING FAILS → RESYNC AND RE-RUN ESPEAK FROM NEXT WORD
        
        if (mapped === null) {
        // delete
        //  console.warn("G2P failed on:", token);

          // Find next real word AFTER the current token
          let nextWordIndex = t + 1;
          while (
            nextWordIndex < tokens.length &&
            !/^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u
              .test(tokens[nextWordIndex])
          ) {
            nextWordIndex++;
          }

          // No more words → output original and continue
          if (nextWordIndex >= tokens.length) {
            converted.push(token);
            continue;
          }

          // Collect remaining words starting from that next real word
          const remainingWords = tokens
            .slice(t)
            .filter(tt =>
              /^[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]+'?[A-Za-zÀ-ÖØ-öø-ÿĀ-žḀ-ỿ]*$/u.test(tt)
            );
           // delete console
          // console.log("Re-running eSpeak for:", remainingWords);

          // Rebuild IPA map for remaining sequence
          ipaMap = await computeIPAMap(remainingWords);

          // Retry mapping the *current* token
          ipa = ipaMap.get(token) || "";
          mapped = applyG2PMapping(token, ipa);
        }
          
          // If still failing, output original
          if (mapped === null) {
            converted.push(token);
            continue;
          }
        

// Only validate words that came from eSpeak
//  if (!getDictionaryIPA(token)) {
  mapped = validateOrReturnOriginal(token, mapped);
//  }

        // Pull all IPA inside parentheses
        const ipaPieces = [...mapped.matchAll(/\(([^()]*)\)/g)];
        const ipaString = ipaPieces.map(x => x[1]).join("");

        if (!ipaString.trim()) {
          converted.push(token);
          } else {

        // Final inline form: WORD (IPA)
        converted.push(`${token} (${ipaString})`);  //  This is the only line where testoafi button part of code differs with afi button.
      }
      }


      // Reconstruct output preserving EXACT original whitespace
   
      let rebuilt = '';
      let pos = 0;

      for (const token of tokens) {
        while (chunk[pos] && /\s/.test(chunk[pos])) {
          rebuilt += chunk[pos++];
        }
        rebuilt += converted.shift();
        pos += token.length;
      }

      finalResult += rebuilt;
    }

    setOutput(finalResult.trim());

  } catch (e) {
    console.error("Error in G2P Inline:", e);
    setOutput("Error during G2P Inline processing: " + e.message);
  }
});
